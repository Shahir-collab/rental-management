{% extends "base.html" %}

{% block title %}{{ 'Edit Entry' if mode == 'edit' else 'New Entry' }}{% endblock %}
{% block page_title %}Communications{% endblock %}

{% block content %}
<div class="mb-4 text-sm text-gray-500">
    <a href="/communications" class="hover:underline">Communications</a> > <span class="text-gray-900 font-medium">{{ 'Edit Entry' if mode == 'edit' else 'New Entry' }}</span>
</div>

<div class="max-w-2xl bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <form action="{{ '/communications/' ~ log.id ~ '/edit' if mode == 'edit' else '/communications/new' }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tenant</label>
            <select name="tenant_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm" required>
                <option value="">Select Tenant...</option>
                {% for t in tenants %}
                <option value="{{ t.id }}" {% if (log and log.tenant_id == t.id) or selected_tenant == t.id %}selected{% endif %}>{{ t.name }} ({{ t.id }})</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                <select name="log_type" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm" required>
                    <option value="Call" {% if log and log.log_type == 'Call' %}selected{% endif %}>Call</option>
                    <option value="Visit" {% if log and log.log_type == 'Visit' %}selected{% endif %}>Visit</option>
                    <option value="Complaint" {% if log and log.log_type == 'Complaint' %}selected{% endif %}>Complaint</option>
                    <option value="Note" {% if log and log.log_type == 'Note' %}selected{% endif %}>Note</option>
                    <option value="Reminder" {% if log and log.log_type == 'Reminder' %}selected{% endif %}>Reminder</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Follow-up Date (Optional)</label>
                <input type="date" name="follow_up_date" value="{{ log.follow_up_date.strftime('%Y-%m-%d') if log and log.follow_up_date else '' }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
            <input type="text" name="subject" value="{{ log.subject if log else '' }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm" required>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea name="description" rows="5" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm" required>{{ log.description if log else '' }}</textarea>
        </div>

        <div class="pt-2">
            <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2 px-4 rounded-lg shadow-sm hover:bg-blue-700">
                {{ 'Update Entry' if mode == 'edit' else 'Save Entry' }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
