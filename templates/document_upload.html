{% extends "base.html" %}

{% block title %}Upload Document{% endblock %}
{% block page_title %}Documents{% endblock %}

{% block content %}
<div class="mb-4 text-sm text-gray-500">
    <a href="/documents" class="hover:underline">Documents</a> > <span class="text-gray-900 font-medium">Upload</span>
</div>

<div class="max-w-2xl bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <form action="/documents/upload" method="POST" enctype="multipart/form-data" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tenant</label>
            <select name="tenant_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm" required>
                <option value="">Select Tenant...</option>
                {% for t in tenants %}
                <option value="{{ t.id }}">{{ t.name }} ({{ t.id }})</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Agreement (Optional)</label>
                <select name="agreement_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm">
                    <option value="">None</option>
                    {% for a in agreements %}
                    <option value="{{ a.id }}">{{ a.id }} - {{ a.unit_no }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Unit No</label>
                <input type="text" name="unit_no" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm" required>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Document Type</label>
            <select name="doc_type" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm" required>
                <option value="Agreement">Agreement</option>
                <option value="ID Proof">ID Proof</option>
                <option value="Photo">Photo</option>
                <option value="Receipt">Receipt</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">File</label>
            <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg">
                <div class="space-y-1 text-center">
                    <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <div class="flex text-sm text-gray-600 justify-center">
                        <label class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none">
                            <span>Upload a file</span>
                            <input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" class="sr-only" required>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Remarks</label>
            <textarea name="remarks" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm"></textarea>
        </div>

        <div class="pt-2">
            <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2 px-4 rounded-lg shadow-sm hover:bg-blue-700">Upload Document</button>
        </div>
    </form>
</div>
{% endblock %}
