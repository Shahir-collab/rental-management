{% extends "base.html" %}

{% block title %}Record Payment{% endblock %}
{% block page_title %}Record Payment{% endblock %}

{% block content %}
<div class="mb-4 text-sm text-gray-500">
    <a href="/payments" class="hover:text-blue-600">Payments</a> &gt; <span class="text-gray-900">Record Payment</span>
</div>

<div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
    <form action="/payments/new" method="POST" class="space-y-4">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tenant</label>
                <select name="tenant_id" required class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm bg-white">
                    <option value="">Select Tenant</option>
                    {% for t in tenants %}
                    <option value="{{ t.id }}">{{ t.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Unit</label>
                <input type="text" name="unit_no" required class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Month</label>
                <input type="text" name="month" value="{{ current_month }}" required class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Amount (₹)</label>
                <input type="number" name="amount" required class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Payment Date</label>
                <!-- default to today via alpine or just plain html if no template rendering for date is easy -->
                <input type="date" name="payment_date" required class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm" x-data x-init="$el.value = new Date().toISOString().split('T')[0]">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Payment Method</label>
                <select name="payment_method" required class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm bg-white">
                    <option value="Cash">Cash</option>
                    <option value="UPI">UPI</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                    <option value="Cheque">Cheque</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Reference No.</label>
                <input type="text" name="reference_no" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm">
            </div>
            
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Remarks</label>
                <textarea name="remarks" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm text-sm"></textarea>
            </div>
        </div>
        
        <div class="mt-6">
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow-sm hover:bg-blue-700 font-medium text-sm">
                Record Payment
            </button>
        </div>
    </form>
</div>
{% endblock %}
