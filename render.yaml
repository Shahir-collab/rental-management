services:
  - type: web
    name: rental-management
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rental-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - name: rental-db
    plan: free
    databaseName: rental_mgr
